  history:
    eyebrow: "Measured evidence"
    title: "Signal history"
    subtitle: "Daily snapshots preserve what the model actually knew at the time. This prevents future performance reports from accidentally using information from the future."
    method_note_html: "Outcomes are measured the way the event study measures them. Each signal is entered at the close <em>after</em> the signal date — the signal is derived from that day's close, so that close is not tradable — and is compared against the model pool of the same day: the stocks the strategy could have picked then, signal or not. Excess is the date-weighted difference between the two, so a cohort that merely rose with the market has earned nothing."
    basis_adjusted: "Returns are measured on dividend- and split-adjusted closes — the prices a shareholder would actually have seen — so a dividend or a bonus share no longer reads as a loss. The signals themselves are still derived from the raw close."
    basis_raw: "Returns are measured on raw closes: no corporate-action records are loaded for %{area}, so a dividend or a bonus share still reads as a loss."

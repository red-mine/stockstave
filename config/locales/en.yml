# Every user-facing string in the app lives here. The English file is the
# source of truth: the Chinese file must carry exactly the same keys, or a
# reader switching languages would hit a missing translation. A test
# (test/lib/stock/locale_completeness_test.rb) enforces that.
#
# The domain code under lib/stock never speaks for itself: it returns the
# keys below, and the view layer translates them. That keeps the signal
# catalogue and the ranking rules free of any particular language.

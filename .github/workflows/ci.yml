name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILS_ENV: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Prepare test database
        run: bundle exec rails db:prepare

      - name: Check pending migrations
        run: bundle exec rails runner 'abort "Pending migrations" if ActiveRecord::Base.connection_pool.migration_context.needs_migration?'

      - name: Check application autoloading
        run: bundle exec rails zeitwerk:check

      - name: Check PowerShell automation syntax
        shell: pwsh
        run: ./bin/check-powershell-syntax.ps1

      - name: Check Windows and Linux automation parity
        run: ./bin/check-ops-parity.sh

      - name: Scan Rails application security
        run: bundle exec brakeman --no-pager --no-color --quiet

      - name: Run tests
        run: bundle exec rails test

      - name: Check generated schema and whitespace
        run: |
          git diff --exit-code -- db/schema.rb
          git diff --check

      - name: Validate Linux setup scripts
        run: |
          bash -n bin/setup-linux
          bash -n bin/daily-refresh.sh
          bash -n bin/update-tdx-data.sh
          bash -n bin/install-daily-refresh-cron.sh
          bash -n bin/install-daily-refresh-timer.sh
          bash -n bin/start-public-preview.sh
          bash -n bin/public-preview-status.sh
          bash -n bin/ensure-public-preview.sh
          bash -n bin/install-public-preview-monitor.sh

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # An advisory should stay loud but must not gate the rest of CI: every
      # earlier green run on record was red only here, so bundler-audit hid the
      # test suite for months. As its own job it reports independently of tests,
      # parity, and the security scanner.
      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update
